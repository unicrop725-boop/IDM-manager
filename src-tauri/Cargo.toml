[workspace]
members = ["engine"]

[package]
name = "flowget"
version = "0.1.0"
description = "FlowGet - a modern download manager"
edition = "2021"
default-run = "flowget"

[lib]
name = "flowget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
flowget-engine = { path = "engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
librqbit = "9.1.0"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json"] }
ring = "0.17"
base64 = "0.22"
rfd = { version = "0.15", default-features = false }
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
