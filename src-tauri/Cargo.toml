[workspace]
members = ["engine"]

[package]
name = "flowget"
version = "0.1.0"
description = "FlowGet - a modern download manager"
edition = "2021"

[lib]
name = "flowget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
flowget-engine = { path = "engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
