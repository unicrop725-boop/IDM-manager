  <rect x="44" y="36" width="136" height="34" rx="8" fill="#1A73E8"/>
  <text x="112" y="58" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Load unpacked</text>

  <rect x="192" y="36" width="132" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
