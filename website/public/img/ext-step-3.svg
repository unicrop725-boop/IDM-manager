  <rect x="404" y="274" width="140" height="36" rx="8" fill="#1A73E8"/>
  <text x="474" y="297" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Select Folder</text>
